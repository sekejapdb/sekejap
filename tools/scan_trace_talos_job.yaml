apiVersion: batch/v1
kind: Job
metadata:
  name: e4-scan-io-20260914
  namespace: sekejap-benchmark
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      nodeName: server
      priorityClassName: benchmark-low
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: bench
          image: rust:1-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              art=<scratch>
              mkdir -p "$art"
              while [ ! -f "$art/source-ready" ]; do sleep 2; done
              cd "$art"
              uname -a > platform.txt
              cc --version >> platform.txt
              cc -O2 -Wall -Wextra buffered_rewrite_probe.c -o buffered-rewrite-probe
              sha256sum buffered_rewrite_probe.c buffered-rewrite-probe > hashes.txt
              ./buffered-rewrite-probe "$art/c-buffered" > c-buffered.log 2>&1
              touch probe-complete
              while [ ! -f "$art/complete" ]; do sleep 2; done
          resources:
            requests: {cpu: "1", memory: "256Mi"}
            limits: {cpu: "2", memory: "512Mi"}
          volumeMounts:
            - {name: data, mountPath: <scratch>}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sekejap-benchmark-data
