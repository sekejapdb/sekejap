apiVersion: batch/v1
kind: Job
metadata:
  name: e4-pair-packing-20260914
  namespace: sekejap-benchmark
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  template:
    spec:
      restartPolicy: Never
      nodeName: server
      priorityClassName: benchmark-low
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: bench
          image: rust:1-bookworm
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "mkdir -p <scratch>; while [ ! -f <scratch> ]; do sleep 5; done"]
          resources:
            requests: {cpu: "1", memory: "512Mi"}
            limits: {cpu: "2", memory: "2Gi"}
          volumeMounts:
            - {name: data, mountPath: <scratch>}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sekejap-benchmark-data
