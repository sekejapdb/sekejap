[package]
name = "sekejap-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The sekejap engine: typed collections, graph edges, and vector, spatial and full-text indexes over the storage kernel"
repository = "https://github.com/sekejapdb/sekejap"
homepage = "https://github.com/sekejapdb/sekejap"
readme = "README.md"
keywords = ["database", "graph", "vector", "spatial", "fulltext"]
categories = ["database-implementations"]

[lib]
name = "sekejap_core"
path = "src/lib.rs"

[dependencies]
kernel = { package = "sekejap-kernel", path = "../kernel", version = "0.17.1" }
serde_json = { version = "1", features = ["float_roundtrip"] }
crc32c = "0.6"
getrandom = "0.4"
geographiclib-rs = { version = "=0.2.7", default-features = false }

[dev-dependencies]
tempfile = "3"
kernel = { package = "sekejap-kernel", path = "../kernel", version = "0.17.1", features = ["test-support"] }
# `tests/spatial_geometry_postgis.rs` is a conformance oracle: it asks a live
# PostGIS the same questions and compares. A TEST dependency only -- no module
# of the engine links it, and the test skips itself when no DSN answers.
postgres = "0.19"

[features]
sqlite-balance = ["kernel/sqlite-balance"]
compact-cells = ["kernel/compact-cells"]
keyspace-append = ["kernel/keyspace-append"]
slotref-split = ["kernel/slotref-split"]
