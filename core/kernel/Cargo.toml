[package]
name = "sekejap-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

# The package is `sekejap-kernel` (the crates.io name); the library target keeps
# the name `kernel`, which is how every dependent and every test of this crate
# has always imported it.
description = "The storage kernel of sekejap: a disk-first B-tree over a page-WAL, with typed packed pages and crash recovery"
repository = "https://github.com/sekejapdb/sekejap"
homepage = "https://github.com/sekejapdb/sekejap"
readme = "README.md"
keywords = ["database", "btree", "storage", "wal", "embedded"]
categories = ["database-implementations", "filesystem"]
[lib]
name = "kernel"

[dependencies]
crc32c = "0.6"
libc   = "0.2"

[dependencies.tempfile]
version = "3"

[features]
default = []
write-trace = []
test-support = []
sqlite-balance = []
compact-cells = []
# D9 per-keyspace append: fire the rightmost-append split when the new key is
# the largest of ITS OWN key tag, not only of the whole tree. Default OFF so a
# paired benchmark builds control and candidate from one source tree.
keyspace-append = []
# L2.3-2 allocation-free split: move leaf/sibling records as SlotRefs into
# pinned page images plus one reusable scratch, instead of a Vec<u8> per
# record. Page images and split decisions are byte-identical either way.
# Default OFF so one source tree builds control and candidate.
slotref-split = []

[dev-dependencies]
tempfile = "3"
