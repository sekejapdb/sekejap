[package]
name = "sekejap-dist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The sekejap distribution layer: the service wrapper, the Postgres wire server and the command line"
repository = "https://github.com/sekejapdb/sekejap"
homepage = "https://github.com/sekejapdb/sekejap"
readme = "README.md"
keywords = ["database", "postgres", "server", "wire", "cli"]
categories = ["database-implementations", "command-line-utilities"]

[lib]
name = "sekejap_dist"
path = "src/lib.rs"

# The P0 storage benchmark. It was the binary named `sekejap` until the SQL
# shell took the name (`dist/rust/src/bin/sekejap.rs`), which is what the
# README and e1's `skcli` mean by it.
[[bin]]
name = "p0_bench"
path = "src/cli/main.rs"
required-features = ["dev-bench"]

[[bin]]
name = "recover"
path = "src/cli/recover.rs"

[[bin]]
name = "collection_inspect"
path = "src/cli/collection_inspect.rs"

[[bin]]
name = "collections"
path = "src/cli/collections.rs"
required-features = ["dev-bench"]

[[bin]]
name = "control_tree_audit"
path = "src/cli/control_tree_audit.rs"

[[bin]]
name = "pagewal_repair"
path = "src/cli/pagewal_repair.rs"

[[bin]]
name = "entry"
path = "src/cli/entry.rs"
required-features = ["dev-bench"]

[[bin]]
name = "lifecycle"
path = "src/cli/lifecycle.rs"
required-features = ["dev-bench"]

[[bin]]
name = "sekejap-pg"
path = "src/cli/pg_server.rs"

[dependencies]
sekejap-core = { path = "../core/engine", version = "0.17.0" }
sekejap-lang = { path = "../lang", version = "0.17.0" }
kernel = { package = "sekejap-kernel", path = "../core/kernel", version = "0.17.0" }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
crc32c = "0.6"

[dev-dependencies]
tempfile = "3"
# The END-TO-END test of `sekejap-pg` drives the server with a real
# PostgreSQL client rather than with frames this repository wrote, so the
# thing under test is the protocol and not this file's idea of it. Already a
# workspace dependency for the `popsim postgres` bench arm.
postgres = "0.19"

[features]
# The internal benchmarks (p0_bench, collections, entry, lifecycle) write only
# under the project volume they were measured on, so they are built on
# request, never by `cargo install sekejap-dist`.
dev-bench = []
sqlite-balance = ["sekejap-core/sqlite-balance", "sekejap-lang/sqlite-balance"]
compact-cells = ["sekejap-core/compact-cells", "sekejap-lang/compact-cells"]
keyspace-append = ["sekejap-core/keyspace-append", "sekejap-lang/keyspace-append"]
slotref-split = ["sekejap-core/slotref-split", "sekejap-lang/slotref-split"]
