name: sekejap
description: >-
  Embedded graph-first multi-model database (SQL + graph + vector + spatial).
  dart:ffi bindings over the sekejap C ABI, for Dart and Flutter.
version: 0.17.2
homepage: https://sekejap.life
repository: https://github.com/sekejapdb/sekejap
topics:
  - database
  - sql
  - graph
  - ffi

environment:
  # Pure Dart: no Flutter floor. `dart:ffi`'s ABI-specific integer types
  # (Long, UintPtr), which C `long` in the header needs, are 2.17+; 3.4 is the
  # floor the rest of the wrapper tooling shares.
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  # The one dependency: UTF-8 conversion and the arena allocator for borrowed
  # strings. No Flutter, no code generation, no build hook.
  ffi: ">=2.1.0 <3.0.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
