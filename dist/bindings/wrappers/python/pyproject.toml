# sekejap for Python -- a pure-Python package over the C ABI.
#
# There is no extension module to compile here and no Rust in the build: the
# binding is ctypes over `libsekejap`, the library `dist/ffi` builds. What a
# platform wheel adds to the source distribution is that library, copied into
# `sekejap/_lib/` before the wheel is built and found there at import.
#
#   sdist   pure Python, no library. Needs one on the machine: $SEKEJAP_LIBRARY,
#           a `make install` of dist/ffi, or the loader path.
#   wheel   the same Python plus `sekejap/_lib/libsekejap.{dylib,so,dll}`,
#           tagged for the platform that library was built for.

[build-system]
requires = ["setuptools>=77", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sekejap"                      # the PyPI identity; keep it
version = "0.17.3"                    # [workspace.package].version of the repository
description = "sekejap -- an embedded multi-model database: documents, SQL, graph, vector, spatial, in one file"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT OR Apache-2.0"        # LICENSE-MIT and LICENSE-APACHE at the repository root
keywords = ["database", "embedded", "sql", "graph", "vector", "spatial", "multi-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = []                     # ctypes and json are in the standard library

[project.urls]
homepage = "https://sekejap.life"
repository = "https://github.com/sekejapdb/sekejap"
documentation = "https://github.com/sekejapdb/sekejap/blob/main/docs/dist/C_ABI.md"

[project.optional-dependencies]
pandas = ["pandas>=1.3"]              # only `db.df` needs it
test = ["pytest>=7.0"]

[project.scripts]
sekejap = "sekejap.__main__:main"

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = false   # the wheel takes its library from package-data below; MANIFEST.in drives the sdist

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
# Empty in the source distribution; a wheel job drops the library in first.
sekejap = ["_lib/*.dylib", "_lib/*.so", "_lib/*.dll", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
