[package]
name = "sekejap"
description = "sekejap: the compact typed embedded database -- one crate over the core, language and distribution layers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/sekejapdb/sekejap"
homepage = "https://github.com/sekejapdb/sekejap"
readme = "README.md"
keywords = ["database", "embedded", "graph", "vector", "sql"]
categories = ["database", "database-implementations", "embedded"]

[dependencies]
sekejap-core = { path = "../../core/engine", version = "0.17.3" }
sekejap-lang = { path = "../../lang", version = "0.17.3" }
sekejap-dist = { path = "..", version = "0.17.3" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
tempfile = "3"

# The four storage features are the configuration every E4 test group runs
# under (`docs/LAYERS.md`), so the published crate ships that configuration
# rather than a second, untested one. Each is additive on disk
# (`docs/core/FORMAT_V2.md`); `default-features = false` switches them off.
[features]
default = ["compact-cells", "sqlite-balance", "keyspace-append", "slotref-split"]
sqlite-balance = ["sekejap-core/sqlite-balance"]
compact-cells = ["sekejap-core/compact-cells"]
keyspace-append = ["sekejap-core/keyspace-append"]
slotref-split = ["sekejap-core/slotref-split"]
