# Own workspace root — decoupled from the parent so napi's host-symbol linking
# never affects the main workspace build.
[workspace]

[package]
name = "sekejap-node"
version = "0.16.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
sekejap = { path = "../.." }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
