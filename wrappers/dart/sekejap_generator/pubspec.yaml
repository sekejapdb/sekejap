name: sekejap_generator
description: >-
  build_runner code generator for sekejap @SekejapEntity models — emits typed
  collections, column references, and (de)serializers.
version: 0.17.0
homepage: https://sekejap.life
repository: https://github.com/sekejapdb/sekejap
topics:
  - codegen
  - build-runner
  - database
  - orm

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  analyzer: ">=8.1.1 <9.0.0"
  build: ">=2.4.0 <4.0.0"
  source_gen: ">=4.2.0 <5.0.0"

dev_dependencies:
  build_runner: ">=2.4.0 <3.0.0"
  lints: ^5.0.0
